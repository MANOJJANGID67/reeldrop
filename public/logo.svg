<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Deep Indigo to Violet (Distinct from any Instagram palette) -->
    <linearGradient id="reelDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#reelDropGrad)" />

  <!-- Media Reel Orbit -->
  <circle cx="256" cy="244" r="145" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Film Reel Spool Apertures -->
  <circle cx="256" cy="126" r="12" fill="#FFFFFF" fill-opacity="0.35" />
  <circle cx="256" cy="362" r="12" fill="#FFFFFF" fill-opacity="0.35" />
  <circle cx="138" cy="244" r="12" fill="#FFFFFF" fill-opacity="0.35" />
  <circle cx="374" cy="244" r="12" fill="#FFFFFF" fill-opacity="0.35" />

  <!-- Center Download Arrow & Drop Base -->
  <g filter="url(#subtleShadow)">
    <!-- Stem -->
    <rect x="235" y="169" width="42" height="100" rx="10" fill="#FFFFFF" />
    <!-- Arrow Head -->
    <path d="M161 254 L351 254 L256 342 Z" fill="#FFFFFF" />
    <!-- Download Base Plate -->
    <rect x="201" y="374" width="110" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.9" />
  </g>
</svg>